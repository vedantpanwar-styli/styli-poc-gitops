apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: poc-manual-lower
  namespace: argocd
spec:
  goTemplate: false

  # Cloud Build writes the digest here on every release merge, but qa and uat
  # are synced by hand so a running test session is not interrupted.
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - env: qa
                - env: uat
          - git:
              repoURL: https://github.com/vedantpanwar-styli/styli-poc-gitops
              revision: main
              files:
                - path: "envs/{{env}}/apps/*.yaml"

  template:
    metadata:
      name: "{{env}}-{{service}}"
    spec:
      project: poc
      sources:
        - repoURL: https://github.com/vedantpanwar-styli/styli-poc-gitops
          targetRevision: main
          path: charts/poc-service
          helm:
            valueFiles:
              - $values/envs/{{env}}/apps/{{service}}.yaml
        - repoURL: https://github.com/vedantpanwar-styli/styli-poc-gitops
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "poc-service-{{env}}"
      syncPolicy:
        # no automated block
        syncOptions: [CreateNamespace=true]
