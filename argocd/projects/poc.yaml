apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: poc
  namespace: argocd
spec:
  description: PoC service

  # only this repo
  sourceRepos:
    - https://github.com/vedantpanwar-styli/styli-poc-gitops

  # only these namespaces. Clusters are matched by name, so registering the
  # production cluster later is an argocd cluster add plus a name here.
  destinations:
    - name: in-cluster
      namespace: poc-service-dev
    - name: in-cluster
      namespace: poc-service-qa
    - name: in-cluster
      namespace: poc-service-uat
    - name: in-cluster
      namespace: poc-service-prod

  # Namespace only, because syncOptions has CreateNamespace=true. Everything
  # else the chart deploys is namespaced.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
